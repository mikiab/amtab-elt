name: CI

permissions:
  contents: read

on:
  pull_request:
      branches: [main]
  push:
      branches: [main]

jobs:
  tests:
    name: "Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: "Install the project"
        run: uv sync --locked --no-dev --group test

      - name: "Run tests"
        run: uv run --no-sync pytest

  dbt:
    name: "dbt"
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ci-dummy
      GOOGLE_APPLICATION_CREDENTIALS: /dev/null

    steps:
      - uses: actions/checkout@v7

      - name: "Install uv"
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true

      - name: "Install the project"
        run: uv sync --locked --no-dev

      - name: "Install dbt packages"
        run: uv run --no-sync dbt deps --project-dir dbt --profiles-dir dbt

      - name: "Parse dbt project"
        run: uv run --no-sync dbt parse --project-dir dbt --profiles-dir dbt

  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.7"

      - name: "Check formatting"
        run: terraform fmt -check -recursive

      - name: "Initialize Terraform"
        run: terraform init -backend=false -lockfile=readonly

      - name: "Validate configuration files"
        run: terraform validate
